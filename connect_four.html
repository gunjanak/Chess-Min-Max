<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connect Four — Minimax AI</title>
<link href="https://fonts.googleapis.com/css2?family=Righteous&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e1a;
    --surface: #111827;
    --board-bg: #1a2744;
    --board-border: #2a3d6b;
    --cell-empty: #0d1520;
    --cell-empty-glow: #0a1830;
    --p1: #ff3d5a;
    --p1-dark: #8b1525;
    --p1-glow: rgba(255,61,90,0.5);
    --p2: #ffd020;
    --p2-dark: #7a5f00;
    --p2-glow: rgba(255,208,32,0.5);
    --text: #e2e8f8;
    --text-muted: #6b7a9e;
    --accent: #4a7fff;
    --win-flash: rgba(255,255,255,0.15);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    background-image: radial-gradient(ellipse at 20% 20%, rgba(74,127,255,0.06) 0%, transparent 60%),
                      radial-gradient(ellipse at 80% 80%, rgba(255,61,90,0.05) 0%, transparent 60%);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 16px 40px;
    gap: 20px;
  }

  header { text-align: center; }
  h1 {
    font-family: 'Righteous', cursive;
    font-size: 2.6rem;
    letter-spacing: 0.08em;
    background: linear-gradient(135deg, var(--p1) 0%, var(--p2) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 20px rgba(255,120,60,0.3));
  }
  .subtitle {
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-top: 4px;
  }

  /* Score bar */
  .scorebar {
    display: flex;
    align-items: center;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--board-border);
    border-radius: 12px;
    overflow: hidden;
    width: 100%;
    max-width: 520px;
  }
  .score-player {
    flex: 1;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: background 0.3s;
  }
  .score-player.active { background: rgba(255,255,255,0.04); }
  .score-player:first-child { border-right: 1px solid var(--board-border); }
  .disc-icon {
    width: 28px; height: 28px;
    border-radius: 50%;
    flex-shrink: 0;
    box-shadow: 0 0 12px var(--glow, transparent);
  }
  .disc-icon.red { background: var(--p1); --glow: var(--p1-glow); }
  .disc-icon.yellow { background: var(--p2); --glow: var(--p2-glow); }
  .score-info { flex: 1; }
  .score-name { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-muted); }
  .score-val { font-size: 1.4rem; font-weight: 500; color: var(--text); line-height: 1.2; }
  .active-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    opacity: 0;
    transition: opacity 0.3s;
    animation: blink 1s ease-in-out infinite;
  }
  .score-player.active .active-dot { opacity: 1; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* Column hover indicators */
  .col-indicators {
    display: flex;
    gap: 8px;
    padding: 0 8px;
    width: 100%;
    max-width: 520px;
    height: 28px;
    align-items: center;
  }
  .col-ind {
    flex: 1;
    display: flex;
    justify-content: center;
    cursor: pointer;
  }
  .col-ind-arrow {
    width: 0; height: 0;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-top: 12px solid transparent;
    transition: border-top-color 0.15s;
  }
  .col-ind.hover .col-ind-arrow { border-top-color: var(--p1); }

  /* Board */
  .board-wrap {
    background: var(--board-bg);
    border: 2px solid var(--board-border);
    border-radius: 16px;
    padding: 10px;
    box-shadow:
      0 0 0 1px rgba(74,127,255,0.1),
      0 20px 60px rgba(0,0,0,0.6),
      inset 0 1px 0 rgba(255,255,255,0.05);
    width: 100%;
    max-width: 520px;
  }
  #board {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
  }
  .cell {
    aspect-ratio: 1;
    border-radius: 50%;
    background: var(--cell-empty);
    box-shadow: inset 0 3px 8px rgba(0,0,0,0.6), inset 0 1px 3px rgba(0,0,0,0.4);
    cursor: pointer;
    transition: background 0.1s;
    position: relative;
    overflow: hidden;
  }
  .cell::after {
    content: '';
    position: absolute;
    top: 8%; left: 15%;
    width: 30%; height: 20%;
    border-radius: 50%;
    background: rgba(255,255,255,0.07);
    pointer-events: none;
  }
  .cell.p1 {
    background: var(--p1);
    box-shadow: 0 0 16px var(--p1-glow), inset 0 -3px 6px rgba(0,0,0,0.3), inset 0 3px 6px rgba(255,255,255,0.15);
    animation: dropIn 0.35s cubic-bezier(0.34,1.56,0.64,1);
  }
  .cell.p2 {
    background: var(--p2);
    box-shadow: 0 0 16px var(--p2-glow), inset 0 -3px 6px rgba(0,0,0,0.3), inset 0 3px 6px rgba(255,255,255,0.2);
    animation: dropIn 0.35s cubic-bezier(0.34,1.56,0.64,1);
  }
  .cell.win {
    animation: winPulse 0.6s ease-in-out infinite alternate;
  }
  .cell.p1.win { box-shadow: 0 0 28px var(--p1-glow), 0 0 8px var(--p1); }
  .cell.p2.win { box-shadow: 0 0 28px var(--p2-glow), 0 0 8px var(--p2); }

  @keyframes dropIn {
    from { transform: scaleY(0.2) scaleX(0.8); opacity: 0.5; }
    to   { transform: scaleY(1) scaleX(1); opacity: 1; }
  }
  @keyframes winPulse {
    from { transform: scale(0.9); }
    to   { transform: scale(1.08); }
  }

  /* Column hover highlight */
  .cell.col-hover { background: rgba(255,61,90,0.12); }

  /* Controls */
  .controls {
    display: flex;
    gap: 10px;
    width: 100%;
    max-width: 520px;
    flex-wrap: wrap;
  }
  .ctrl-group {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--board-border);
    border-radius: 10px;
    padding: 12px 14px;
    min-width: 140px;
  }
  .ctrl-label {
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--text-muted);
    margin-bottom: 8px;
  }
  select, input[type=range] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--board-border);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    padding: 6px 8px;
    border-radius: 6px;
    outline: none;
    appearance: none;
  }
  input[type=range] { padding: 2px 0; accent-color: var(--accent); }
  .depth-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .depth-val { font-size: 0.75rem; color: var(--accent); }

  .btn {
    flex: 1;
    padding: 12px;
    background: transparent;
    border: 1px solid var(--board-border);
    color: var(--text-muted);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.15s;
    min-width: 120px;
  }
  .btn:hover { border-color: var(--accent); color: var(--text); background: rgba(74,127,255,0.06); }
  .btn.primary { border-color: var(--accent); color: var(--accent); }
  .btn.primary:hover { background: rgba(74,127,255,0.12); }

  /* Status */
  .status-bar {
    width: 100%;
    max-width: 520px;
    background: var(--surface);
    border: 1px solid var(--board-border);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 0.8rem;
    color: var(--text);
    text-align: center;
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .status-bar.thinking { color: var(--p2); animation: blink 0.8s ease-in-out infinite; }
  .status-bar.win-human { color: var(--p1); }
  .status-bar.win-ai    { color: var(--p2); }
  .status-bar.draw      { color: var(--text-muted); }
</style>
</head>
<body>

<header>
  <h1>Connect Four</h1>
  <p class="subtitle">Minimax AI — Alpha-Beta Pruning</p>
</header>

<div class="scorebar">
  <div class="score-player active" id="sp1">
    <div class="disc-icon red"></div>
    <div class="score-info">
      <div class="score-name">You</div>
      <div class="score-val" id="s1">0</div>
    </div>
    <div class="active-dot"></div>
  </div>
  <div class="score-player" id="sp2">
    <div class="disc-icon yellow"></div>
    <div class="score-info">
      <div class="score-name">AI</div>
      <div class="score-val" id="s2">0</div>
    </div>
    <div class="active-dot"></div>
  </div>
</div>

<div class="col-indicators" id="col-indicators"></div>

<div class="board-wrap">
  <div id="board"></div>
</div>

<div class="status-bar" id="status">Your turn — drop a red disc</div>

<div class="controls">
  <div class="ctrl-group">
    <div class="ctrl-label">AI Depth</div>
    <div class="depth-row">
      <span style="font-size:0.65rem;color:var(--text-muted)">Easier</span>
      <span class="depth-val" id="depth-label">5</span>
      <span style="font-size:0.65rem;color:var(--text-muted)">Harder</span>
    </div>
    <input type="range" min="1" max="8" value="5" id="depth-sel"
           oninput="document.getElementById('depth-label').textContent=this.value">
  </div>
  <div class="ctrl-group">
    <div class="ctrl-label">Play as</div>
    <select id="side-sel" onchange="newGame()">
      <option value="1">Red (first)</option>
      <option value="2">Yellow (second)</option>
    </select>
  </div>
  <button class="btn primary" onclick="newGame()">New Game</button>
</div>

<script>
const ROWS=6, COLS=7;
const HUMAN=1, AI=2;
let board, currentPlayer, humanDisc, aiDisc, gameOver, thinking;
let scores={1:0,2:0};
let hoveredCol=-1;

// ── Board ─────────────────────────────────────────────────────────
function makeBoard(){ return Array.from({length:ROWS},()=>Array(COLS).fill(0)); }

function dropDisc(b,col,player){
  for(let r=ROWS-1;r>=0;r--){
    if(b[r][col]===0){ b[r][col]=player; return r; }
  }
  return -1;
}

function isValidCol(b,col){ return b[0][col]===0; }

function getValidCols(b){ return [...Array(COLS).keys()].filter(c=>isValidCol(b,c)); }

function cloneBoard(b){ return b.map(r=>[...r]); }

// ── Win detection ─────────────────────────────────────────────────
function checkWin(b,player){
  // horizontal
  for(let r=0;r<ROWS;r++)
    for(let c=0;c<=COLS-4;c++)
      if([0,1,2,3].every(i=>b[r][c+i]===player)) return true;
  // vertical
  for(let r=0;r<=ROWS-4;r++)
    for(let c=0;c<COLS;c++)
      if([0,1,2,3].every(i=>b[r+i][c]===player)) return true;
  // diagonal /
  for(let r=3;r<ROWS;r++)
    for(let c=0;c<=COLS-4;c++)
      if([0,1,2,3].every(i=>b[r-i][c+i]===player)) return true;
  // diagonal \
  for(let r=0;r<=ROWS-4;r++)
    for(let c=0;c<=COLS-4;c++)
      if([0,1,2,3].every(i=>b[r+i][c+i]===player)) return true;
  return false;
}

function getWinCells(b,player){
  const cells=[];
  for(let r=0;r<ROWS;r++)
    for(let c=0;c<=COLS-4;c++)
      if([0,1,2,3].every(i=>b[r][c+i]===player)){ [0,1,2,3].forEach(i=>cells.push([r,c+i])); }
  for(let r=0;r<=ROWS-4;r++)
    for(let c=0;c<COLS;c++)
      if([0,1,2,3].every(i=>b[r+i][c]===player)){ [0,1,2,3].forEach(i=>cells.push([r+i,c])); }
  for(let r=3;r<ROWS;r++)
    for(let c=0;c<=COLS-4;c++)
      if([0,1,2,3].every(i=>b[r-i][c+i]===player)){ [0,1,2,3].forEach(i=>cells.push([r-i,c+i])); }
  for(let r=0;r<=ROWS-4;r++)
    for(let c=0;c<=COLS-4;c++)
      if([0,1,2,3].every(i=>b[r+i][c+i]===player)){ [0,1,2,3].forEach(i=>cells.push([r+i,c+i])); }
  return cells;
}

function isBoardFull(b){ return b[0].every(c=>c!==0); }

// ── Evaluation ────────────────────────────────────────────────────
function scoreWindow(window, player){
  const opp=player===HUMAN?AI:HUMAN;
  const pc=window.filter(x=>x===player).length;
  const ec=window.filter(x=>x===0).length;
  const oc=window.filter(x=>x===opp).length;
  if(pc===4) return 100;
  if(pc===3&&ec===1) return 5;
  if(pc===2&&ec===2) return 2;
  if(oc===3&&ec===1) return -4;
  return 0;
}

function evaluate(b, player){
  let score=0;
  // center column bonus
  const centerCol=b.map(r=>r[3]);
  score+=centerCol.filter(x=>x===player).length*3;

  // horizontal
  for(let r=0;r<ROWS;r++)
    for(let c=0;c<=COLS-4;c++)
      score+=scoreWindow([b[r][c],b[r][c+1],b[r][c+2],b[r][c+3]],player);
  // vertical
  for(let r=0;r<=ROWS-4;r++)
    for(let c=0;c<COLS;c++)
      score+=scoreWindow([b[r][c],b[r+1][c],b[r+2][c],b[r+3][c]],player);
  // diagonal /
  for(let r=3;r<ROWS;r++)
    for(let c=0;c<=COLS-4;c++)
      score+=scoreWindow([b[r][c],b[r-1][c+1],b[r-2][c+2],b[r-3][c+3]],player);
  // diagonal \
  for(let r=0;r<=ROWS-4;r++)
    for(let c=0;c<=COLS-4;c++)
      score+=scoreWindow([b[r][c],b[r+1][c+1],b[r+2][c+2],b[r+3][c+3]],player);
  return score;
}

// ── Minimax ───────────────────────────────────────────────────────
function minimax(b, depth, alpha, beta, maximizing){
  const validCols=getValidCols(b);
  const isTerminal=checkWin(b,AI)||checkWin(b,HUMAN)||validCols.length===0;

  if(depth===0||isTerminal){
    if(isTerminal){
      if(checkWin(b,AI))  return {score:1000000};
      if(checkWin(b,HUMAN)) return {score:-1000000};
      return {score:0};
    }
    return {score:evaluate(b,AI)};
  }

  // Move ordering: center columns first
  const ordered=[3,2,4,1,5,0,6].filter(c=>validCols.includes(c));

  if(maximizing){
    let best={score:-Infinity,col:ordered[0]};
    for(const col of ordered){
      const nb=cloneBoard(b);
      dropDisc(nb,col,AI);
      const val=minimax(nb,depth-1,alpha,beta,false).score;
      if(val>best.score){best={score:val,col};}
      alpha=Math.max(alpha,val);
      if(beta<=alpha) break;
    }
    return best;
  } else {
    let best={score:Infinity,col:ordered[0]};
    for(const col of ordered){
      const nb=cloneBoard(b);
      dropDisc(nb,col,HUMAN);
      const val=minimax(nb,depth-1,alpha,beta,true).score;
      if(val<best.score){best={score:val,col};}
      beta=Math.min(beta,val);
      if(beta<=alpha) break;
    }
    return best;
  }
}

// ── Render ────────────────────────────────────────────────────────
function renderBoard(winCells=[]){
  const boardEl=document.getElementById('board');
  boardEl.innerHTML='';
  const winSet=new Set(winCells.map(([r,c])=>r*COLS+c));

  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      const cell=document.createElement('div');
      cell.className='cell';
      cell.dataset.col=c;
      const v=board[r][c];
      if(v===1) cell.classList.add('p1');
      if(v===2) cell.classList.add('p2');
      if(winSet.has(r*COLS+c)) cell.classList.add('win');
      if(v===0&&c===hoveredCol&&!gameOver) cell.classList.add('col-hover');
      boardEl.appendChild(cell);
    }
  }
  renderIndicators();
}

function renderIndicators(){
  const cont=document.getElementById('col-indicators');
  cont.innerHTML='';
  for(let c=0;c<COLS;c++){
    const div=document.createElement('div');
    div.className='col-ind'+(c===hoveredCol?' hover':'');
    div.dataset.col=c;
    div.innerHTML='<div class="col-ind-arrow"></div>';
    cont.appendChild(div);
  }
}

function initBoardEvents(){
  const boardEl=document.getElementById('board');
  boardEl.addEventListener('click',e=>{
    const cell=e.target.closest('.cell');
    if(!cell) return;
    handleClick(parseInt(cell.dataset.col));
  });
  boardEl.addEventListener('mouseover',e=>{
    const cell=e.target.closest('.cell');
    if(!cell) return;
    const c=parseInt(cell.dataset.col);
    if(c!==hoveredCol){ hoveredCol=c; renderBoard(); }
  });
  boardEl.addEventListener('mouseleave',()=>{
    if(hoveredCol!==-1){ hoveredCol=-1; renderBoard(); }
  });

  const indEl=document.getElementById('col-indicators');
  indEl.addEventListener('click',e=>{
    const ind=e.target.closest('[data-col]');
    if(!ind) return;
    handleClick(parseInt(ind.dataset.col));
  });
  indEl.addEventListener('mouseover',e=>{
    const ind=e.target.closest('[data-col]');
    if(!ind) return;
    const c=parseInt(ind.dataset.col);
    if(c!==hoveredCol){ hoveredCol=c; renderBoard(); }
  });
  indEl.addEventListener('mouseleave',()=>{
    if(hoveredCol!==-1){ hoveredCol=-1; renderBoard(); }
  });
}

function setStatus(msg,cls=''){
  const el=document.getElementById('status');
  el.textContent=msg;
  el.className='status-bar'+(cls?' '+cls:'');
}

function updateScores(){
  document.getElementById('s1').textContent=scores[humanDisc];
  document.getElementById('s2').textContent=scores[aiDisc];
  document.getElementById('sp1').classList.toggle('active',currentPlayer===humanDisc&&!gameOver);
  document.getElementById('sp2').classList.toggle('active',currentPlayer===aiDisc&&!gameOver);
}

// ── Game logic ────────────────────────────────────────────────────
function newGame(){
  board=makeBoard();
  humanDisc=parseInt(document.getElementById('side-sel').value);
  aiDisc=humanDisc===1?2:1;
  currentPlayer=1; // player 1 (red) always goes first
  gameOver=false; thinking=false; hoveredCol=-1;
  renderBoard();
  updateScores();
  if(currentPlayer===aiDisc){
    setStatus('AI thinking…','thinking');
    setTimeout(doAIMove,300);
  } else {
    setStatus('Your turn — drop a '+(humanDisc===1?'red':'yellow')+' disc');
  }
}

function handleClick(col){
  if(gameOver||thinking||currentPlayer!==humanDisc) return;
  if(!isValidCol(board,col)) return;
  dropDisc(board,col,humanDisc);
  currentPlayer=aiDisc;
  const won=checkWin(board,humanDisc);
  if(won){
    scores[humanDisc]++;
    gameOver=true;
    const wc=getWinCells(board,humanDisc);
    renderBoard(wc);
    updateScores();
    setStatus('🎉 You win!','win-human');
    return;
  }
  if(isBoardFull(board)){
    gameOver=true; renderBoard(); setStatus("It's a draw!",'draw'); return;
  }
  renderBoard();
  updateScores();
  setStatus('AI thinking…','thinking');
  thinking=true;
  setTimeout(doAIMove,80);
}

function doAIMove(){
  const depth=parseInt(document.getElementById('depth-sel').value);
  const result=minimax(board,depth,-Infinity,Infinity,true);
  dropDisc(board,result.col,aiDisc);
  currentPlayer=humanDisc;
  thinking=false;
  const won=checkWin(board,aiDisc);
  if(won){
    scores[aiDisc]++;
    gameOver=true;
    const wc=getWinCells(board,aiDisc);
    renderBoard(wc);
    updateScores();
    setStatus('AI wins! Better luck next time.','win-ai');
    return;
  }
  if(isBoardFull(board)){
    gameOver=true; renderBoard(); setStatus("It's a draw!",'draw'); return;
  }
  renderBoard();
  updateScores();
  setStatus('Your turn — drop a '+(humanDisc===1?'red':'yellow')+' disc');
}

// ── Init ──────────────────────────────────────────────────────────
initBoardEvents();
newGame();
</script>
</body>
</html>
